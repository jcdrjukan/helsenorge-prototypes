<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravid uke 30 – Helsenorge</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────
   FRANKENSTEIN / HELSENORGE DESIGN SYSTEM TOKENS — copied from
   index.html so this page matches it exactly. If those tokens
   change, mirror the change here too (this is a separate static
   file, not a shared stylesheet).
   Source: github.com/helsenorge/designsystem
───────────────────────────────────────────────────────────── */
:root {
  --blueberry-50:  #E4F7F9;
  --blueberry-700: #08667C;

  --neutral-50:  #F5F3F3;
  --neutral-100: #EAE7E7;
  --neutral-200: #D6D4D3;
  --neutral-300: #BDBAB9;
  --neutral-700: #62625F;

  --color-action-text-onlight:       #126F87;
  --color-action-text-onlight-hover: #08667C;
  --color-action-background-onlight: #188097;
  --color-action-background-transparent-onlight-hover: rgba(18,111,135,0.13);
  --color-action-border-onlight:       #188097;
  --color-action-border-onlight-focus: #000000;

  --color-base-text-onlight:          #000000;
  --color-base-text-onlight-subdued:  #474745;
  --color-base-background-dark-neutral: #2B2C2B;
  --color-disabled-text:              #62625F;

  --space-4xs: 0.125rem;
  --space-3xs: 0.25rem;
  --space-2xs: 0.5rem;
  --space-xs:  0.75rem;
  --space-s:   1rem;
  --space-m:   1.5rem;
  --space-l:   2rem;
  --space-xl:  3rem;

  --mobile-h1: 600 2.25rem/122% 'Source Sans Pro', sans-serif;
  --mobile-h2: 600 1.625rem/120% 'Source Sans Pro', sans-serif;
  --mobile-h3: 600 1.375rem/136% 'Source Sans Pro', sans-serif;
  --mobile-h4: 600 1.25rem/130% 'Source Sans Pro', sans-serif;
  --mobile-label: 600 1.125rem/120% 'Source Sans Pro', sans-serif;
  --mobile-label-subdued: 400 1.125rem/120% 'Source Sans Pro', sans-serif;
  --mobile-body: 400 1.125rem/150% 'Source Sans Pro', sans-serif;
  --mobile-image-caption: 400 1rem/150% 'Source Sans Pro', sans-serif;

  --radius-s: 4px;
  --radius-m: 8px;
  --focus-outline: 3px solid #000000;
  --focus-offset:  2px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font: var(--mobile-body);
  color: var(--color-base-text-onlight);
  background: var(--neutral-100);
}

/* ─── Phone-frame mockup ─────────────────────────────────────
   Desktop-only bezel chrome around the prototype; collapses to
   nothing on real phone viewports so the page renders edge-to-edge
   there. Ported verbatim from frankenstein/src/App.css so every
   Helsenorge prototype shares the same phone presentation. ────── */
.phone-wrapper {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #b0b0b0;
  padding: 40px 24px;
  box-sizing: border-box;
  gap: 20px;
}
.phone-frame {
  width: 418px;
  height: 900px;
  flex-shrink: 0;
  background: #111;
  border-radius: 54px;
  padding: 14px;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.06),
    0 50px 120px rgba(0,0,0,0.5);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.phone-frame__screen {
  flex: 1;
  background: #fff;
  border-radius: 42px;
  overflow: hidden;
  overflow-y: auto;
  scrollbar-width: none;
  contain: layout; /* scopes position:fixed descendants to the frame */
}
.phone-frame__screen::-webkit-scrollbar { display: none; }
.phone-frame__home {
  height: 5px;
  width: 130px;
  background: rgba(255,255,255,0.3);
  border-radius: 3px;
  margin: 10px auto 4px;
  flex-shrink: 0;
}
@media (max-width: 480px) {
  .phone-wrapper { background: #fff; padding: 0; justify-content: flex-start; }
  .phone-frame {
    width: 100%; height: auto; border-radius: 0; padding: 0;
    background: transparent; box-shadow: none;
    overflow: visible; /* leftover overflow:hidden would otherwise become the
                           nearest scrolling ancestor for position:sticky
                           descendants, breaking sticky on real phones */
  }
  .phone-frame__screen { border-radius: 0; overflow: visible; overflow-y: visible; }
  .phone-frame__home { display: none; }
}

a:focus-visible, button:focus-visible { outline: var(--focus-outline); outline-offset: var(--focus-offset); border-radius: var(--radius-s); }

/* ─── App shell ──────────────────────────────────────────── */
.app {
  background: #fff;
  width: 360px;
  min-height: 100vh;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-3xs);
}
@media (min-width: 481px) {
  /* Inside the framed screen the app should fill that fixed-height
     container rather than the real (much taller) browser viewport. */
  .app { min-height: 100%; }
}

/* ═══════════════════════════════════════════════════════════
   HEADER — identical to index.html's, kept in sync by hand.
══════════════════════════════════════════════════════════════ */
.header { background: var(--blueberry-50); width: 100%; }
.header__top { background: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; }
.header__left { display: flex; gap: 24px; align-items: center; }
.logo { display: flex; align-items: center; text-decoration: none; flex-shrink: 0; height: 36px; }
.icon-btn { display: flex; flex-direction: column; align-items: center; gap: 0; background: none; border: none; cursor: pointer; padding: 0 4px 4px; border-radius: var(--radius-m); color: var(--color-base-text-onlight); text-decoration: none; }
.icon-btn:hover { background: var(--color-action-background-transparent-onlight-hover); }
.icon-btn__icon { width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; }
.icon-btn__icon svg { display: block; width: 38px; height: 38px; }
.icon-btn__label { font: 600 16px/18px 'Source Sans Pro', sans-serif; color: var(--color-base-text-onlight); white-space: nowrap; }

.profile-bar { background: #fff; border-top: 1px solid var(--blueberry-700); border-bottom: 1px solid var(--blueberry-700); display: flex; align-items: center; gap: var(--space-2xs); padding: var(--space-3xs) var(--space-xs); cursor: pointer; }
.profile-bar__inner { display: flex; flex: 1; gap: var(--space-2xs); align-items: center; min-width: 0; }
.avatar { width: 38px; height: 38px; background: var(--color-action-background-onlight); border-radius: var(--radius-s); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #fff; font: 600 16px/1.4 'Source Sans Pro', sans-serif; }
.profile-bar__name { font: var(--mobile-label); color: var(--color-base-text-onlight); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chevron { width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--color-base-text-onlight); }
.chevron svg { width: 18px; height: 18px; }

/* ═══════════════════════════════════════════════════════════
   BREADCRUMB — back to Gravid (this page's parent), not Forside;
   same component/CSS as index.html's, different destination+label.
══════════════════════════════════════════════════════════════ */
.breadcrumb { width: 100%; padding: 0 4px; }
.breadcrumb__back { display: flex; align-items: center; gap: 0; background: none; border: none; cursor: pointer; padding: 4px 0; color: #000; font: 600 18px/1.2 'Source Sans Pro', sans-serif; text-decoration: none; }
.breadcrumb__back:hover { text-decoration: underline; }

.page-divider {
  border: none;
  border-top: 1px solid var(--neutral-200);
  margin: 0 1rem;
  /* .app is align-items:center, so without an explicit cross-axis size
     this content-less <hr> collapses to 0 width instead of filling the
     row — stretch it so the line is actually visible (same fix as
     index.html's copy of this rule). */
  align-self: stretch;
}

/* Språk/Language switcher — decorative (matches Figma nodes 43:483–485
   exactly; not wired to anything, same treatment as this prototype's
   other inert chrome like Meny/Varsler). */
.lang-switcher {
  width: 344px;
  display: flex;
  justify-content: flex-end;
  padding-top: var(--space-s);
}
.lang-switcher__btn {
  display: inline-flex;
  align-items: center;
  gap: var(--space-3xs);
  background: none;
  border: none;
  cursor: pointer;
  color: var(--color-base-text-onlight);
  font: var(--mobile-label-subdued);
}
.lang-switcher__btn svg {
  width: 24px;
  height: 24px;
  color: var(--blueberry-700); /* "link" green (#08667C) — text stays
                                   black, only the globe + chevron are
                                   colored */
}

/* ═══════════════════════════════════════════════════════════
   PAGE TITLE
══════════════════════════════════════════════════════════════ */
.page-title { width: 344px; padding-top: var(--space-s); }
.page-title h1 { font: var(--mobile-h1); color: var(--color-base-text-onlight); }

/* ═══════════════════════════════════════════════════════════
   TABS — Barn / Mor / Svangerskapskontroll (Figma nodes 43:483–485).
   A static translation of the real Frankenstein/design-system Tabs
   component (@helsenorge/designsystem-react's Tabs/TabList/TabPanel —
   see node_modules/@helsenorge/designsystem-react/lib/TabList.js and
   lib/components/Tabs/{TabList,TabPanel}/styles.module.scss), not a
   hand-rolled underline bar: same classnames, same DOM shape (ul/li/
   button), same mobile-width CSS values (color/border tokens, 3rem
   tab height, 0.5rem/1.5rem padding, 0.5rem top corner radius). Only
   the component's own scroll-fade/chevron buttons and its >=md
   desktop boxed-panel variant are left out — this prototype is
   mobile-only, like the rest of gravid/*.html.
══════════════════════════════════════════════════════════════ */
.tab-list-wrapper {
  position: relative;
  width: 344px;
  margin-top: var(--space-m);
}

.tab-list {
  position: relative;
  display: flex;
  flex-direction: row;
  gap: 0.25rem;
  list-style-type: none;
  white-space: nowrap;
  overflow: auto hidden;
  height: 3rem;
  margin: 0 0 -1px;
  background-color: #fff;
  padding-left: 0.5rem;
  padding-right: 0.5rem;
  scrollbar-width: none;
}
.tab-list::-webkit-scrollbar { display: none; }

.tab-list__tab {
  display: flex;
  align-items: start;
  background-color: #fff;
  height: 3rem;
  text-align: start;
  font-size: 1.25rem;
  font-family: 'Source Sans Pro', sans-serif;
  text-decoration: none;
  padding: 0.5rem 1.5rem;
  color: var(--color-action-text-onlight);
  border: 1px solid var(--color-action-border-onlight);
  border-bottom: 0;
  border-radius: 0.5rem 0.5rem 0 0;
  position: relative;
  cursor: pointer;
  z-index: 0;
}

.tab-list__tab--selected {
  overflow: visible;
  border-color: var(--color-action-border-onlight-focus);
  color: var(--color-base-text-onlight);
  background-color: #fff;
  z-index: 2;
}

.tab-list__tab--not-selected:hover {
  background-color: var(--color-action-background-transparent-onlight-hover);
}

.tab-list__tab__title-and-icon {
  display: flex;
  flex-flow: row nowrap;
  align-items: center;
  gap: 0.5rem;
  height: 2rem;
}

.tab-list__border {
  position: absolute;
  z-index: 1;
  pointer-events: none;
  bottom: 0;
  left: 0;
  width: 100%;
  border-bottom: 1px solid var(--color-action-border-onlight-focus);
}

/* ═══════════════════════════════════════════════════════════
   TAB PANEL — same padding/border as the real TabPanel component.
══════════════════════════════════════════════════════════════ */
.tab-panel {
  width: 344px;
  padding: var(--space-l) var(--space-s) var(--space-xl);
  border-bottom: 1px solid var(--color-action-border-onlight-focus);
  display: flex;
  flex-direction: column;
  gap: var(--space-s);
}

/* [hidden] is a UA-stylesheet rule, which loses to the author rule
   above at equal specificity — same class of bug hit earlier on this
   prototype's inline SVGs. Restate it explicitly so switching tabs
   actually hides the inactive panels. */
.tab-panel[hidden] {
  display: none;
}

.section-h2 { width: 344px; font: var(--mobile-h2); color: var(--color-base-text-onlight); }
.body-text { font: var(--mobile-body); color: var(--color-base-text-onlight); }
.caption-text { font: var(--mobile-image-caption); color: var(--color-disabled-text); }

/* Sub-structure inside a panel's content (weeks with a <h2>/<ul> in the
   source spreadsheet cell, e.g. Mor uke 6–8's "Vanlig med blødninger"
   sub-section, or Kontroll uke 24's several consultation sub-topics) —
   one level down from the panel's own .section-h2 heading. */
.section-h3 { font: var(--mobile-h3); color: var(--color-base-text-onlight); margin-top: var(--space-2xs); }
.body-list { font: var(--mobile-body); color: var(--color-base-text-onlight); margin: 0; padding-left: var(--space-m); }
.body-list li { margin-bottom: var(--space-3xs); }

.sp-s { height: var(--space-s); flex-shrink: 0; width: 100%; }

/* ═══════════════════════════════════════════════════════════
   WEEK NAVIGATION — flip to the adjacent week, keeping the
   currently-open tab (Figma nodes 43:483–485). Shared across all
   three tab panels, not per-tab.
══════════════════════════════════════════════════════════════ */
.week-nav {
  width: 344px;
  padding: var(--space-m) 0 var(--space-xl);
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid var(--neutral-200);
}

.week-nav__link {
  display: inline-flex;
  align-items: center;
  gap: var(--space-3xs);
  text-decoration: none;
  color: var(--color-action-text-onlight);
  font: var(--mobile-label);
}

.week-nav__link:hover { color: var(--color-action-text-onlight-hover); }
.week-nav__link svg { width: 24px; height: 24px; }

/* ═══════════════════════════════════════════════════════════
   FOOTER — identical to index.html's/avslutt.html's, kept in sync
   by hand (this is a separate static file, not a shared stylesheet).
══════════════════════════════════════════════════════════════ */
.footer {
  background: var(--color-base-background-dark-neutral);
  width: 100%;
  padding: var(--space-m) var(--space-xs);
  display: flex;
  flex-direction: column;
  gap: var(--space-s);
}

.footer__row { display: flex; align-items: center; gap: var(--space-s); }
.footer__icon { width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #fff; }
.footer__icon svg { width: 24px; height: 24px; }
.footer__text-group { flex: 1; }
.footer__text-large { font: var(--mobile-label); font-size: 1.125rem; color: #fff; display: block; }
.footer__text-small { font: var(--mobile-image-caption); color: var(--neutral-300); display: block; }
.footer__divider { height: 1px; background: var(--neutral-700); }
.footer__links { display: flex; flex-direction: column; gap: var(--space-s); }
.footer__link { font: var(--mobile-label-subdued); font-size: 1.125rem; color: #fff; text-decoration: none; }
.footer__link:hover { text-decoration: underline; }
.footer__lang { display: flex; gap: var(--space-m); align-items: center; }
.footer__lang-sep { width: 1px; height: 24px; background: var(--neutral-700); }
.footer__brand { font: var(--mobile-h4); font-size: 1.375rem; font-weight: 600; color: #fff; }
</style>
</head>

        </a>
        <button class="icon-btn" aria-label="Åpne meny" aria-expanded="false">
          <div class="icon-btn__icon" aria-hidden="true">

// ─── Helpers ───────────────────────────────────────────────
function findRange(list, week) {
  return list.find(r => week >= r.from && week <= r.to) || null;
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// A paragraphs entry is either a plain string (rendered as a <p>), or one
// of two richer item types the source spreadsheet content used inline —
// {type:'heading', text} for a sub-heading partway through a panel's
// content (e.g. Kontroll uke 24's several consultation sub-topics), and
// {type:'list', items} for a bullet list (e.g. Mor uke 6–8's symptom
// list). Both are one level below the panel's own .section-h2 heading.
function renderContentItem(item) {
  if (typeof item === 'string') {
    return '<p class="body-text">' + escapeHtml(item) + '</p>';
  }
  if (item.type === 'heading') {
    return '<h3 class="section-h3">' + escapeHtml(item.text) + '</h3>';
  }
  if (item.type === 'list') {
    return '<ul class="body-list">' + item.items.map(i => '<li>' + escapeHtml(i) + '</li>').join('') + '</ul>';
  }
  return '';
}

function renderPanel(elId, data) {
  const el = document.getElementById(elId);
  if (!data) {
    el.innerHTML = '<p class="caption-text">Innhold for denne uken kommer snart.</p>';
    return;
  }
  el.innerHTML =
    '<h2 class="section-h2">' + escapeHtml(data.heading) + '</h2>' +
    data.paragraphs.map(renderContentItem).join('');
}

let currentTab = 'barn';

function showTab(tabId) {
  currentTab = tabId;
  document.querySelectorAll('.tab-list__tab').forEach(t => {
    const selected = t.dataset.tab === tabId;
    t.classList.toggle('tab-list__tab--selected', selected);
    t.classList.toggle('tab-list__tab--not-selected', !selected);
    t.setAttribute('aria-selected', selected ? 'true' : 'false');
    // Matches the real TabList component: scroll the newly-selected tab
    // into view, since the tab row can overflow on a phone-width screen.
    if (selected) t.scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' });
  });
  document.querySelectorAll('.tab-panel').forEach(p => {
    p.hidden = p.id !== tabId + 'Panel';
  });
  // The prev/next links carry the current tab along (&tab=...) so flipping
  // a week keeps whichever tab you were reading, instead of always
  // dropping back to Barn.
  updateWeekNav();
}

// ─── Week navigation — flip to the previous/next week ───────
const MIN_WEEK = 1;
const MAX_WEEK = 42;

function updateWeekNav() {
  const prevWeek = week - 1;
  const nextWeek = week + 1;
  const prevLink = document.getElementById('weekNavPrev');
  const nextLink = document.getElementById('weekNavNext');

  if (prevWeek >= MIN_WEEK) {
    prevLink.href = 'uke-for-uke.html?uke=' + prevWeek + '&tab=' + currentTab;
    document.getElementById('weekNavPrevLabel').textContent = 'Uke ' + prevWeek;
    prevLink.style.visibility = 'visible';
  } else {
    prevLink.style.visibility = 'hidden';
  }

  if (nextWeek <= MAX_WEEK) {
    nextLink.href = 'uke-for-uke.html?uke=' + nextWeek + '&tab=' + currentTab;
    document.getElementById('weekNavNextLabel').textContent = 'Uke ' + nextWeek;
    nextLink.style.visibility = 'visible';
  } else {
    nextLink.style.visibility = 'hidden';
  }
}

// ─── Init — reads ?uke=NN (defaults to 30) and ?tab= from the URL ───
function renderWeek(week) {
  document.getElementById('pageH1').textContent = 'Gravid uke ' + week;
  document.title = 'Gravid uke ' + week + ' – Helsenorge';
  renderPanel('barnPanel', BARN_CONTENT[week] || null);
  renderPanel('morPanel', findRange(MOR_CONTENT, week));
  renderPanel('kontrollPanel', findRange(KONTROLL_CONTENT, week));
}

const params = new URLSearchParams(location.search);
// Falls back to whatever week dashboard.html last saved, same as
// index.html, so arriving here without an explicit ?uke= (e.g. a
// direct link) still reflects the chosen scenario instead of always
// resetting to 30.
let dashboardWeekFallback = 30;
try {
  const saved = parseInt(localStorage.getItem('gravid-dashboard-week'), 10);
  if (saved >= MIN_WEEK && saved <= MAX_WEEK) dashboardWeekFallback = saved;
} catch {
  // ignore
}
const requestedWeek = parseInt(params.get('uke'), 10);
const week = (requestedWeek >= MIN_WEEK && requestedWeek <= MAX_WEEK) ? requestedWeek : dashboardWeekFallback;
const requestedTab = params.get('tab');
const initialTab = ['barn', 'mor', 'kontroll'].includes(requestedTab) ? requestedTab : 'barn';
renderWeek(week);
showTab(initialTab); // also sets up the week-nav links via updateWeekNav()
</script>
</body>
</html>
