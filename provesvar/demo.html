<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Prøvesvar – demo</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Prototype control panel — not part of the patient-facing pages
   (same idea as gravid/dashboard.html). Plain styling on purpose. */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Source Sans Pro', sans-serif; background: #F5F3F3; color: #000; padding: 2rem 1rem; }
main { max-width: 40rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
h1 { font-size: 1.75rem; }
h2 { font-size: 1.25rem; margin-bottom: 0.5rem; }
p { line-height: 1.5; }
section { background: #fff; border: 1px solid #D6D4D3; border-radius: 8px; padding: 1rem 1.25rem; }
table { width: 100%; border-collapse: collapse; font-size: 1rem; }
th, td { text-align: left; padding: 0.5rem 0.5rem 0.5rem 0; border-bottom: 1px solid #EAE7E7; vertical-align: top; }
th { font-weight: 600; }
a { color: #126F87; }
.status--sperret { color: #62625F; font-weight: 600; }
.status--slettet { color: #A31F0E; font-weight: 600; }
label { display: flex; gap: 0.5rem; align-items: center; font-size: 1.125rem; cursor: pointer; }
input[type="checkbox"] { width: 1.25rem; height: 1.25rem; }
.knapper { display: flex; flex-wrap: wrap; gap: 0.75rem; }
button, .knapp { font: 600 1.125rem 'Source Sans Pro', sans-serif; padding: 0.6rem 1.25rem; border-radius: 0.5rem; border: 0; cursor: pointer; text-decoration: none; }
.knapp--primar { background: #188097; color: #fff; }
.knapp--sekundar { background: transparent; color: #126F87; outline: 2px solid #08667C; outline-offset: -2px; }
.hint { color: #474745; font-size: 1rem; margin-top: 0.25rem; }
</style>
</head>
<body>
<main>
  <div>
    <h1>Prøvesvar – demo</h1>
    <p class="hint">Kontrollpanel for prototypen. Ikke en del av tjenesten. Tilstanden ligger bare i denne nettleseren.</p>
  </div>

  <section>
    <h2>Sperre og slette</h2>
    <table>
      <thead><tr><th>Prøvesvar</th><th>Status</th><th></th></tr></thead>
      <tbody id="statusTabell"></tbody>
    </table>
  </section>

  <section>
    <h2>Simuler feil</h2>
    <label><input type="checkbox" id="apiFeil"> Simuler API-feil</label>
    <p class="hint">Sperring, oppheving og sletting feiler og viser feilsiden («Vi fikk ikke …»). Ingenting endres.</p>
  </section>

  <div class="knapper">
    <a class="knapp knapp--primar" href="index.html">Åpne prototypen</a>
    <button type="button" class="knapp--sekundar" id="nullstill">Nullstill alt</button>
  </div>
  <p class="hint" id="nullstilt" role="status"></p>
</main>

<script src="data.js"></script>
<script>
(function () {
  function render() {
    const sperret = lesLS(LS_SPERRET, {});
    const slettet = lesLS(LS_SLETTET, {});
    document.getElementById('statusTabell').innerHTML = Object.entries(RESULTATER).map(([id, r]) => {
      const status = slettet[id] ? `<span class="status--slettet">Slettet ${slettet[id].replace(', ', ' kl. ')}</span>`
        : sperret[id] ? `<span class="status--sperret">Sperret ${sperret[id]}</span>` : 'Synlig';
      const lenke = slettet[id] ? '' : `<a href="resultat.html?id=${id}">Åpne</a>`;
      return `<tr><td>${r.omrade}<br><span class="hint">${r.dato}</span></td><td>${status}</td><td>${lenke}</td></tr>`;
    }).join('');
    document.getElementById('apiFeil').checked = apiFeilPa();
  }
  document.getElementById('apiFeil').addEventListener('change', e => settApiFeil(e.target.checked));
  document.getElementById('nullstill').addEventListener('click', () => {
    nullstillPersonvern();
    render();
    document.getElementById('nullstilt').textContent = 'Alt er nullstilt: ingen svar er sperret eller slettet, og API-feil er slått av.';
  });
  render();
})();
</script>
</body>
</html>
